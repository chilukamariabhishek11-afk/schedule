<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exam Timetable · Oct 8–16</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#14213d;--mute:#5b6b82;--line:#d5dde7;--acc:#2a6f97;--acc2:#e3eef6;--ok:#2f7d4f;--exam:#f2b544;--examink:#3a2a00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1826;--card:#17243a;--ink:#e8eef7;--mute:#9db0c8;--line:#2a3b57;--acc:#6db3dd;--acc2:#1d3552;--ok:#6cc58d}}
:root[data-theme="dark"]{--bg:#0f1826;--card:#17243a;--ink:#e8eef7;--mute:#9db0c8;--line:#2a3b57;--acc:#6db3dd;--acc2:#1d3552;--ok:#6cc58d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
h1{font-size:clamp(1.9rem,6vw,3rem);line-height:1.05;margin:0;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--mute);margin:6px 0 0}
.count{background:var(--exam);color:var(--examink);border-radius:16px;padding:12px 20px;text-align:center;min-width:130px}
.count b{display:block;font-size:3rem;line-height:1;font-weight:800}
.prog{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:20px}
.bar{height:10px;background:var(--acc2);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
h2{font-size:1.15rem;margin:28px 0 10px}
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.names input{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.day.today{outline:3px solid var(--acc)}
.day.exam{background:var(--exam);color:var(--examink);border-color:var(--exam)}
.day h3{margin:0;font-size:1.05rem;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
